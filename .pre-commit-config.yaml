# Pre-commit hooks for automatic code formatting and linting.
# Some hooks edit files; rerun the same command after fixes before committing.

repos:
  # Ruff - Fast Python linter (replaces flake8, isort, pyupgrade)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Trailing whitespace and file cleanup
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-ast
      - id: debug-statements
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files

  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Python security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-r, app]
        pass_filenames: false

  # Python type checks
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.411
    hooks:
      - id: pyright
        args: [app, scripts, tasks]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        additional_dependencies: [types-cachetools]
        args: [--ignore-missing-imports, app, scripts, tasks]
        pass_filenames: false

  # Jinja template linting
  - repo: https://github.com/djlint/djLint
    rev: v1.39.4
    hooks:
      - id: djlint
        args: [--profile=jinja, --lint]
        files: ^app/.*templates/.*\.html$

  # Dead code detection
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture

  # App import smoke check
  - repo: local
    hooks:
      - id: flask-app-import
        name: Flask app import
        entry: python -c "from app import create_app; create_app()"
        language: system
        pass_filenames: false
        types: [python]

      # No native pre-commit repo hook is published for import-linter; run it via pip like flask-app-import.
      - id: import-linter
        name: Import layering check
        entry: lint-imports
        language: python
        additional_dependencies: [import-linter==2.15]
        pass_filenames: false
        types: [python]
