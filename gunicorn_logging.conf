[loggers]
keys=root,gunicorn.error,gunicorn.access

[handlers]
keys=console

[formatters]
keys=json

[logger_root]
level=INFO
handlers=console

[logger_gunicorn.error]
level=INFO
handlers=console
propagate=0
qualname=gunicorn.error

[logger_gunicorn.access]
level=WARNING
handlers=
propagate=0
qualname=gunicorn.access

[handler_console]
class=StreamHandler
level=INFO
formatter=json
args=(sys.stdout,)

[formatter_json]
class=app.shared.json_logging.AppJsonFormatter
format=%(asctime)s %(levelname)s %(name)s %(process)d %(message)s
