<!DOCTYPE html>
<html>
<head>
  <title>All Items - {{ squad }}</title>
  <style>
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
  </style>
</head>
<body>
  <h2>All Items for {{ squad|upper }}</h2>
  <a href="{{ url_for('inventory.admin_panel', squad=squad) }}">← Back to Admin Panel</a>

  <table>
    <tr>
      <th>Name</th>
      <th>Category</th>
      <th>UPC</th>
      <th>Quantity</th>
      <th>Threshold</th>
    </tr>
    {% for item in items %}
    <tr>
      <td>{{ item.name }}</td>
      <td>{{ item.category }}</td>
      <td>{{ item.upc }}</td>
      <td>{{ item.quantity }}</td>
      <td>{{ item.threshold }}</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
