<!DOCTYPE html>
<html>
<head>
  <title>Admin Login - {{ squad }}</title>
</head>
<body>
  <h2>Admin Login for {{ squad|upper }}</h2>
  {% if error %}
    <p style="color:red;">{{ error }}</p>
  {% endif %}
  <form method="POST">
    <input type="text" name="password" placeholder="Enter admin password" required>
    <button type="submit">Login</button>
  </form>
</body>
</html>
