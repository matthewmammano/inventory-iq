<!DOCTYPE html>
<html>
<head>
  <title>Edit Items - {{ squad }}</title>
  <style>
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; }
    input.changed { background-color: #d4ffd4; }
    input:invalid { background-color: #ffd3d3; }
    .delete-btn {
      background-color: #ff6666;
      color: white;
      border: none;
      padding: 5px 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Admin Edit Items for {{ squad|upper }}</h2>

  <form method="POST" action="{{ url_for('inventory.save_items', squad=squad) }}"
        onsubmit="cleanupEmptyRows(); return confirm('Are you sure you want to save all changes?')">
    <table id="itemTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Category</th>
          <th>Increments</th>
          <th>Image</th>
          <th>Threshold</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {% for item in items %}
        <tr>
          <td><input required name="name" value="{{ item.name }}" data-original="{{ item.name }}" onchange="trackChange(this)"></td>
          <td><input required name="category" value="{{ item.category }}" data-original="{{ item.category }}" onchange="trackChange(this)"></td>
          <td><input required name="increments" value="{{ item.increments }}" data-original="{{ item.increments }}" onchange="trackChange(this)"></td>
          <td><input required name="image" value="{{ item.image }}" data-original="{{ item.image }}" onchange="trackChange(this)"></td>
          <td><input required type="number" name="threshold" value="{{ item.threshold }}" data-original="{{ item.threshold }}" onchange="trackChange(this)"></td>
          <td><button type="button" class="delete-btn" onclick="deleteRow(this)">✕</button></td>
        </tr>
        {% endfor %}
        <tr class="optional">
          <td><input name="name" onchange="trackChange(this)"></td>
          <td><input name="category" onchange="trackChange(this)"></td>
          <td><input name="increments" onchange="trackChange(this)"></td>
          <td><input name="image" onchange="trackChange(this)"></td>
          <td><input type="number" name="threshold" onchange="trackChange(this)"></td>
          <td></td>
        </tr>
      </tbody>
    </table>
    <br>
    <button type="submit">Submit All Changes</button>
    <button type="button" onclick="window.location='{{ url_for('inventory.admin_panel', squad=squad) }}'">Cancel</button>
  </form>

  <script>
    function trackChange(input) {
      const original = input.dataset.original;
      const current = input.value;
      if (original !== undefined && current !== original) {
        input.classList.add('changed');
      } else {
        input.classList.remove('changed');
      }
  
      const row = input.closest('tr');
      const tbody = document.querySelector('#itemTable tbody');
      if (row === tbody.lastElementChild && [...row.querySelectorAll('input')].some(inp => inp.value)) {
        addBlankRow();
      }
    }
  
    function addBlankRow() {
        const tbody = document.querySelector('#itemTable tbody');
        const lastRow = tbody.lastElementChild;

        // Promote last row to required row
        lastRow.classList.remove('optional');
        lastRow.querySelectorAll('input').forEach(input => input.setAttribute('required', 'required'));

        // Insert delete button only if not already present
        const lastCell = lastRow.querySelector('td:last-child');
        if (lastCell && lastCell.innerHTML.trim() === '') {
            lastCell.innerHTML = `<button type="button" class="delete-btn" onclick="deleteRow(this)">✕</button>`;
        }

        // Create new optional row (no required + no delete)
        const newRow = document.createElement('tr');
        newRow.className = 'optional';
        newRow.innerHTML = `
            <td><input name="name" onchange="trackChange(this)"></td>
            <td><input name="category" onchange="trackChange(this)"></td>
            <td><input name="increments" onchange="trackChange(this)"></td>
            <td><input name="image" onchange="trackChange(this)"></td>
            <td><input type="number" name="threshold" onchange="trackChange(this)"></td>
            <td></td>
        `;
        tbody.appendChild(newRow);
    }

  
    function deleteRow(btn) {
      const row = btn.closest('tr');
      row.remove();
    }
  
    function cleanupEmptyRows() {
      const rows = document.querySelectorAll('#itemTable tbody tr');
      rows.forEach(row => {
        const inputs = [...row.querySelectorAll('input')];
        const isEmpty = inputs.every(input => !input.value.trim());
        if (isEmpty) row.remove();
      });
    }
  </script>
  
</body>
</html>
