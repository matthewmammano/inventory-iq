<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel - {{ squad }}</title>
  <style>
    a.action-link {
      display: block;
      margin: 12px 0;
      font-size: 18px;
      text-decoration: none;
      color: #007bff;
    }
    a.action-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h2>Admin Panel for {{ squad|upper }}</h2>
  <p>Welcome, Admin!</p>

  <a href="{{ url_for('inventory.index', squad=squad) }}">← Back to Dashboard</a>
  <hr>

  <a class="action-link" href="{{ url_for('inventory.move_items', squad=squad) }}">➤ Move Items (Storage ↔ Shelf)</a>
  <a class="action-link" href="{{ url_for('inventory.recount_items', squad=squad) }}">➤ Recount Items (e.g. Tourniquets)</a>
  <a class="action-link" href="{{ url_for('inventory.admin_items', squad=squad) }}">➤ View All Items + Counts</a>
  <a class="action-link" href="{{ url_for('inventory.edit_items', squad=squad) }}">➤ Edit / Add / Remove Items</a>
  </body>
</html>
