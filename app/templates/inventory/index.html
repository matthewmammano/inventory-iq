<!DOCTYPE html>
<html lang="en">
<head>
    <title>Inventory</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
</head>
<body>
    <header>
        <div>Inventory for {{ squad|upper }}</div>
        <img src="placeholder-logo.png" alt="Logo">
    </header>

    <article>
        <div>
            <h3>Scan or Search Items</h3>
            <ol>
                <li>Hold scanner near <b>BARCODE</b> to scan item</li>
                <li>Pull trigger to <b>SCAN</b></li>
                <li>Or use search below:</li>
            </ol>
            
            <input type="text" id="search" name="search" placeholder="Search items..." />
            <ul id="results"></ul>

        </div>
    </article>

    <!-- Placeholder Images with Links -->
    <a href="{{ url_for('inventory.admin_login', squad=squad) }}">
        <img src="{{ url_for('static', filename='placeholder-admin.png') }}" alt="Admin">
    </a>
    
    <a href="{{ url_for('inventory.help_page', squad=squad) }}">
        <img src="{{ url_for('static', filename='placeholder-help.png') }}" alt="Help">
    </a>

    <!-- Placeholder for Semi-Transparent Overlay -->
    <div id="overlay"></div>
</body>
</html>

<script>
    const allItems = [
            {% for item in items %}
            {
                name: "{{ item.name }}",
                category: "{{ item.category }}",
                upc: "{{ item.upc }}",
                last_accessed: "{{ item.last_accessed.isoformat() if item.last_accessed else '' }}"
            },
            {% endfor %}
        ];

    const fuse = new Fuse(allItems, {
        keys: ['name', 'category', 'upc'],
        threshold: 1, // Lower = stricter, 0.0 = exact match
        includeScore: true
    });


    document.getElementById('search').addEventListener('input', (e) => {
        showResults(e.target.value.toLowerCase())
    })

    function showResults(query) {
        let results = allItems.map(item => {
            let score = 1;  // worst case
            if (query) {
                const match = fuse.search(query, { limit: 1, includeScore: true }).find(r => r.item === item);
                if (match) score = match.score;
            } else {
                score = 0;  // perfect match if no query
            }
            return { item, score };
        });

        results.sort((a, b) => {
            if (a.score !== b.score) return a.score - b.score;
            return new Date(b.item.last_accessed || 0) - new Date(a.item.last_accessed || 0);
        });

        const list = document.getElementById('results');
        list.innerHTML = '';
        results.slice(0, 10).forEach(({ item }) => {
            const li = document.createElement('li');
            li.textContent = `${item.name} (${item.category})`;
            li.onclick = () => alert(`Selected: ${item.name}`);
            list.appendChild(li);
        });
    }



    showResults('');
</script>
