{% macro header_logo(src) %}
    <img src="{{ src }}"
         class="logo"
         alt="Inventory IQ logo"
         loading="lazy"
         decoding="async"
         data-fallback-src="{{ url_for('static', filename='images/not-found.jpg') }}">
{% endmacro %}

{% macro header_button(url, text) %}
    <a href="{{ url }}" class="header-action">{{ text }}</a>
{% endmacro %}
