{% macro header_logo(src) %}
    <img src="{{ src }}" 
         class="header-logo" 
         loading="lazy" 
         decoding="async"
         onerror="this.src='{{ url_for('static', filename='images/not-found.jpg') }}'">
{% endmacro %}

{% macro header_button(url, text) %}
    <a href="{{ url }}" class="header-button">{{ text }}</a>
{% endmacro %}
