[build]
builder = "NIXPACKS"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments.production.cron]
# Hourly: Process email alerts
process_email_alerts.schedule = "0 * * * *"
process_email_alerts.command = "python -m app.tasks.process_email_alerts"

# Daily at 7 PM: Database backup
backup_database.schedule = "0 19 * * *"
backup_database.command = "python -m app.tasks.backup_database"

# Daily at 8 PM: Session cleanup
cleanup_sessions.schedule = "0 20 * * *"
cleanup_sessions.command = "python -m app.tasks.cleanup_sessions"

# Daily at 9 AM: Admin count check
check_admin_recount.schedule = "0 9 * * *"
check_admin_recount.command = "python -m app.tasks.check_admin_recount"

# Daily at 10 AM: Daily reports
daily_reports.schedule = "0 10 * * *"
daily_reports.command = "python -m app.tasks.generate_summary_reports daily"

# Weekly: Friday 4 PM
weekly_reports.schedule = "0 16 * * 5"
weekly_reports.command = "python -m app.tasks.generate_summary_reports weekly"

# Monthly: 1st at 6 PM
archive_action_logs.schedule = "0 18 1 * *"
archive_action_logs.command = "python -m app.tasks.archive_action_logs"

# Monthly: 1st at 3 PM
monthly_reports.schedule = "0 15 1 * *"
monthly_reports.command = "python -m app.tasks.generate_summary_reports monthly"

# Monthly: 1st at 4 PM
monitor_database_size.schedule = "0 16 1 * *"
monitor_database_size.command = "python -m app.tasks.monitor_database_size"
